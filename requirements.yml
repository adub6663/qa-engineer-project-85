---
functional:
  - Два игрока могут соревноваться в решении одной задачи одновременно
  - Игроки видят код и вывод тестов друг друга в реальном времени
  - Пользователь может играть против бота
  - Пользователь может играть с другом по ссылке
  - Пользователь может выбрать уровень сложности задачи
  - Пользователь может выбрать конкретную задачу или получить случайную
  - Пользователь может менять язык программирования во время решения задачи
  - Задачи доступны на русском и английском языках
  - Другие пользователи могут следить за ходом игры
  - Зарегистрированные пользователи могут общаться в чате
  - Завершенная игра доступна для просмотра в записи
  - Пользователи получают очки за победы
  - Отображается рейтинг игроков за неделю, месяц и все время
non-functional:
  - Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен быть адаптирован для мобильных устройств
  - Сайт должен корректно работать в последних версиях браузеров
  - Сайт должен стабильно работать при большом количестве пользователей
implicit:
  - Задачи должны иметь четкое и понятное условие
  - Интерфейс должен быть на двух языках (русском и английском)
  - Регистрация должна быть простой и быстрой
  - Результаты игры должны сохраняться для просмотра записей
  - Чат должен быть доступен только зарегистрированным пользователям
  - Рейтинг должен обновляться автоматически
  - Пользователь должен получать обратную связь о своих действиях (успех/ошибка)
  - При выборе случайной задачи система должна подбирать подходящий уровень сложности
