---
- summary: |
    Проверка регистрации нового пользователя с корректными данными
  requirement: |
    Пользователь может зарегистрироваться на платформе
  prerequisites: |
    Открыта страница регистрации Codebattle
  test-data: |
    Никнейм: "user111"
    Email: "user111@gmail.com"
    Пароль: "Password1234"
    Подтверждение пароля: "Password1234"
  steps:
    - Нажать кнопку "Регистрация" или "Sign Up"
    - Ввести Никнейм 
    - Ввести email 
    - Ввести пароль 
    - Ввести подтверждение пароля 
    - Нажать кнопку "Submit"
  expected-result: |
    Пользователь успешно зарегистрирован, отображается сообщение об успешной регистрации, пользователь автоматически перенаправлен на главную страницу

- summary: |
    Проверка регистрации с уже существующим никнеймом
  requirement: |
    При регистрации с существующим никнеймом система должна показать ошибку
  prerequisites: |
    Открыта страница регистрации Codebattle
    Пользователь с никнеймом "user111" уже зарегистрирован
  test-data: |
    Никнейм: "user111" (уже существует)
    Email: "user123@gmail.com"
    Пароль: "qwerty1234"
    Подтверждение пароля: "qwerty1234"
  steps:
    - Нажать кнопку "Регистрация" или "Sign Up"
    - Ввести никнейм 
    - Ввести email 
    - Ввести пароль
    - Ввести подтверждение пароля 
    - Нажать кнопку "Submit" или "Зарегистрироваться"
  expected-result: |
    Регистрация не выполнена, отображается сообщение об ошибке: "Пользователь с таким никнеймом уже существует"
    Пользователь остается на странице регистрации

- summary: |
    Проверка регистрации с уже существующим email
  requirement: |
    При регистрации с существующим email система должна показать ошибку
