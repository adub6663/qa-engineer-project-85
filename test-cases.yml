    Пользователь с email "user111@gmail.com" уже зарегистрирован
  test-data: |
    Никнейм: "user452"
    Email: "user111@gmail.com" (уже существует)
    Пароль: "la14789"
    Подтверждение пароля: "la14789"
  steps:
    - Нажать кнопку "Регистрация" или "Sign Up"
    - Ввести никнейм 
    - Ввести email 
    - Ввести пароль 
    - Ввести подтверждение пароля 
    - Нажать кнопку "Submit" или "Зарегистрироваться"
  expected-result: |
    Регистрация не выполнена, отображается сообщение об ошибке: "Пользователь с таким email уже зарегистрирован"
    Пользователь остается на странице регистрации

- summary: |
    Проверка регистрации с некорректным email
  requirement: |
    При вводе некорректного email система должна показать ошибку
  prerequisites: |
    Открыта страница регистрации Codebattle
  test-data: |
    Имя пользователя: "user111"
    Email: "lili-email" (без @ и домена)
    Пароль: "qwerty1234"
    Подтверждение пароля: "qwerty1234"
  steps:
    - Нажать кнопку "Регистрация" или "Sign Up"
    - Ввести имя пользователя 
    - Ввести email 
    - Ввести пароль 
    - Ввести подтверждение пароля 
    - Нажать кнопку "Submit" или "Зарегистрироваться"
  expected-result: |
    Регистрация не выполнена, отображается сообщение об ошибке: "Неверный email "

- summary: |
    Проверка регистрации с несовпадающими паролями
  requirement: |
    При несовпадении пароля и подтверждения система должна показать ошибку
  prerequisites: |
    Открыта страница регистрации Codebattle
  test-data: |
    Имя пользователя: "user111"
    Email: "user111@gmail.com"
    Пароль: "qwerty1234"
    Подтверждение пароля: "qwerty14789"
  steps: |
    - Нажать кнопку "Регистрация" или "Sign Up"
    - Ввести имя пользователя 
    - Ввести email 
    - Ввести пароль 
    - Ввести подтверждение пароля 
    - Нажать кнопку "Submit" или "Зарегистрироваться"
  expected-result: |
    Регистрация не выполнена, отображается сообщение об ошибке: "Пароли должны совпадать"

- summary: |
    Проверка входа с корректными данными
  requirement: |
    При вводе корректных email и пароля пользователь должен войти в систему
  prerequisites: |
    Пользователь зарегистрирован с данными:  Email: "user111@gmail.com", пароль "qwerty1234"
    Открыта страница входа Codebattle
  test-data: |
    Email: "user111@gmail.com"
    Пароль: "qwerty1234"
  steps: |
    - Нажать кнопку "Submit" 
    - Ввести логин 
    - Ввести пароль 
    - Нажать кнопку "Submit"  
  expected-result: |
    Пользователь успешно вошел в систему
    Перенаправлен на главную страницу

- summary: |
    Проверка входа с несуществующим email  и паролем
  requirement: |
    При вводе несуществующего email и пароля система должна показать сообщение об ошибке
  prerequisites: |
    Открыта страница входа Codebattle
  test-data: |
    Email: "user111@gmail.com"
    Пароль: "zxcvb123!"
  steps: |
    - Нажать кнопку "Войти"
    - Ввести логин 
    - Ввести пароль 
    - Нажать кнопку "Submit"
  expected-result: |
    Вход не выполнен, отображается сообщение об ошибке: "Неверный email или пароль", пользователь остается на странице входа
    Поля ввода не очищаются

- summary: |
    Проверка выхода из системы
  requirement: |
    Авторизованный пользователь может выйти из системы
  prerequisites: |
    Пользователь авторизован в системе
    Открыта главная страница
  test-data: |
    Нажатие кнопки "Выйти" или "Logout"
  steps: |
    - Нажать на имя пользователя в верхнем меню
    - В выпадающем меню выбрать "Выйти" или "Signout"
  expected-result: |
    Пользователь вышел из системы, перенаправлен на страницу входа или главную страницу для неавторизованных, имя пользователя больше не отображается в меню
    Функции для авторизованных пользователей недоступны

- summary: |
    Проверка соревнования двух игроков в решении одной задачи
  requirement: |
    Два игрока могут соревноваться в решении одной задачи одновременно
  prerequisites: |
    Два пользователя авторизованы на платформе
    Открыта страница создания игры
  test-data: |
    Игрок: создает игру
  steps:
    - Игрок нажимает "Создать игру"
    - Игрок выбирает режим "Игра с другим пользователем"
    - Нажимает "Создать игру"
  expected-result: |
    Оба игрока видят одну и ту же задачу
    Таймер запущен для обоих
    Каждый игрок может вводить код в своем редакторе

- summary: |
    Проверка отображения кода и тестов друг друга в реальном времени
  requirement: |
    Игроки видят код и вывод тестов друг друга в реальном времени
  prerequisites: |
    Игра между двумя игроками начата
  test-data: |
    Игрок 1 вводит код
    Игрок 2 наблюдает за редактором Игрока 1
  steps:
    - Игрок 1 начинает вводить код в редакторе
    - Игрок 1 запускает тесты
  expected-result: |
    Игрок 2 видит изменения кода Игрока 1 в реальном времени
    Игрок 2 видит вывод тестов Игрока 1
    Обновление происходит без задержек

- summary: |
    Проверка игры против бота
  requirement: |
    Пользователь может играть против бота
  prerequisites: |
    Пользователь авторизован на платформе
    Открыта главная страница
  test-data: |
    Выбран уровень сложности: "Средний"
  steps:
    - Нажать кнопку "Создать игру"
    - Выбрать режим "Против бота"
    - Выбрать уровень сложности
    - Выбрать продолжительность игры
    - Выбрать задание 
    - Нажать "Создать игру"
  expected-result: |
    Бот подключен к игре
    Задача отображается у пользователя
    Таймер запущен
    Поле для ввода кода активно

- summary: |
    Проверка игры с другом 
  requirement: |
    Пользователь может играть с другом
  prerequisites: |
    Пользователь авторизован на платформе
    Открыта страница создания игры
  test-data: |
    Выбран режим " Игра с другом"
  steps:
    - Нажать "Создать игру"
    - Выбрать режим "Игра с другом"
    - Ввбрать игрока
    - Нажать "Создать приглашение"
  expected-result: |
    Второй игрок может подключиться
    Игра начинается после подключения второго игрока

- summary: |
    Проверка выбора уровня сложности
  requirement: |
    Пользователь может выбрать уровень сложности задачи
  prerequisites: |
    Пользователь авторизован
    Открыта страница создания игры
  test-data: |
    Доступные уровни: "Начальный", "Легкий", "Средний", "Сложный"
  steps:
    - Нажать "Создать игру"
    - Выбрать режим "Против бота"
    - Выбрать уровень "Сложный"
    - Нажать "Начать игру"
  expected-result: |
    Задача соответствует выбранному уровню сложности
    Сложность задачи выше, чем у "Начального" уровня

- summary: |
    Проверка выбора конкретной задачи
  requirement: |
    Пользователь может выбрать конкретную задачу или получить случайную
  prerequisites: |
    Пользователь авторизован
    Открыта страница создания игры
  test-data: |
    Выбрана задача: "Рассчитайте площадь прямоугольника по заданным длине и ширине"
  steps:
    - Нажать "Создать игру"
    - Выбрать "Выбрать конкретную задачу"
    - Выбрать задачу "Рассчитайте площадь прямоугольника по заданным длине и ширине"
    - Нажать "Начать игру"
  expected-result: |
    Открывается игра с выбранной задачей
    Условие задачи соответствует "Рассчитайте площадь прямоугольника по заданным длине и ширине"

- summary: |
    Проверка получения случайной задачи
  requirement: |
    Пользователь может выбрать конкретную задачу или получить случайную
  prerequisites: |
    Пользователь авторизован
    Открыта страница создания игры
  test-data: |
    Выбран режим: "Случайная задача"
  steps:
    - Нажать "Создать игру"
    - Выбрать режим "Против бота"
    - Выбрать "Случайная задача"
    - Нажать "Начать игру"
  expected-result: |
    Открывается игра со случайной задачей
    Задача соответствует выбранному уровню сложности

- summary: |
    Проверка смены языка программирования во время игры
  requirement: |
    Пользователь может менять язык программирования во время решения задачи
  prerequisites: |
    Игра начата (против бота или другого игрока)
  test-data: |
    Исходный язык: "NodeJS"
    Новый язык: "Python"
  steps:
    - Начать игру на NodeJS
    - В процессе решения выбрать язык "Python" из выпадающего списка
  expected-result: |
    Редактор переключился на Python
    Синтаксическая подсветка соответствует Python
    Задача осталась неизменной
    Игра продолжается без сбоев

- summary: |
    Проверка доступности задач на двух языках
  requirement: |
    Задачи доступны на русском и английском языках
  prerequisites: |
    Пользователь авторизован
    Игра создана
  test-data: |
    Язык интерфейса: "Русский" / "English"
  steps:
    - Переключить язык интерфейса на "English"
    - Посмотреть задачу
    - Переключить язык интерфейса на "Русский"
    - Посмотреть ту же задачу
  expected-result: |
    На английском языке условие задачи отображается на английском
    На русском языке условие задачи отображается на русском
    Содержание задачи одинаковое на обоих языках

- summary: |
    Проверка слежения за игрой другими пользователями
  requirement: |
    Другие пользователи могут следить за ходом игры
  prerequisites: |
    Активная игра между двумя игроками
    Третий пользователь авторизован
  test-data: |
     Активная игра
  steps:
    - Третий пользователь находит активную игру в общем списке
    - Нажимает на игру для просмотра
  expected-result: |
    Открывается страница просмотра игры
    Виден код обоих игроков в реальном времени
    Данные обновляются без перезагрузки

- summary: |
    Проверка отправки сообщения в чате зарегистрированным пользователем
  requirement: |
    Зарегистрированные пользователи могут общаться в чате
  prerequisites: |
    Пользователь авторизован
    Открыта главная страница
  test-data: |
    Текст: "Привет, сообщество!"
  steps:
    - Найти поле ввода чата
    - Ввести текст "Привет, сообщество!"
    - Нажать кнопку "Отправить" или Enter
  expected-result: |
    Сообщение отображается в чате
    Отображается имя пользователя
    Отображается время отправки

- summary: |
    Проверка просмотра завершенной игры в записи
  requirement: |
    Завершенная игра доступна для просмотра в записи
  prerequisites: |
    Пользователь авторизован
    В истории есть завершенная игра
  test-data: |
    Завершенная игра
  steps:
    - Перейти в раздел "Мой профиль"
    - Найти завершенную игру в списке
    - Нажать на запись игры
  expected-result: |
    Открывается страница с записью игры
    Редактор работает как проигрыватель
    Виден код обоих игроков
    Видны результаты тестов

- summary: |
    Проверка получения очков за победу
  requirement: |
    Пользователи получают очки за победы
  prerequisites: |
    Пользователь авторизован
    Игра завершена победой пользователя
  test-data: |
    Победа в игре против бота
  steps:
    - Решить задачу быстрее бота
    - Дождаться завершения игры
    - Перейти в раздел "Статистика"
  expected-result: |
    Пользователь получил очки за победу
    Очки отобразились в статистике

- summary: |
    Проверка переключения интерфейса на русский и английский языки
  requirement: |
    Интерфейс должен быть доступен на русском и английском языках
  prerequisites: |
    Пользователь авторизован
    Открыта главная страница Codebattle
  test-data: |
    Язык 1: "Русский"
    Язык 2: "English"
  steps:
    - Найти переключатель языка в интерфейсе
    - Выбрать язык "English"
    - Проверить отображение элементов интерфейса
    - Выбрать язык "Русский"
    - Проверить отображение элементов интерфейса
  expected-result: |
    При выборе "English" все элементы интерфейса отображаются на английском языке
    При выборе "Русский" все элементы интерфейса отображаются на русском языке
    Переключатель языка доступен и работает корректно
    Названия кнопок, меню и другие элементы переведены полностью

- summary: |
    Проверка просмотра ошибки при неверном решении
  requirement: |
    При некорректном решении пользователь должен получить сообщение об ошибке
  prerequisites: |
    Игра начата
    Открыта задача
  test-data: |
    Неправильный код: return width + length (для задачи на площадь)
  steps:
    - Ввести неправильный код
    - Нажать "Запустить тесты"
  expected-result: |
    Тесты не пройдены
    Отображается сообщение об ошибке
    Указано, какие тесты не прошли
    Игра продолжается

- summary: |
    Проверка успешного решения задачи
  requirement: |
    При корректном решении задача должна быть засчитана
  prerequisites: |
    Игра начата
    Открыта задача
  test-data: |
    Правильный код: return width * length (для задачи на площадь)
  steps:
    - Ввести правильный код
    - Нажать "Запустить тесты"
    - Нажать "Отправить решение"
  expected-result: |
    Все тесты пройдены
    Игра завершена
    Пользователь получает очки
